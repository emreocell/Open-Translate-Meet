ServerTokens Prod
ServerSignature Off
DirectoryIndex index.html index.php

<Directory /var/www/html>
    Options -Indexes -Includes -ExecCGI
    AllowOverride None
    Require all granted
    <FilesMatch "^(?:\.|_.*\.php$|composer\.(?:json|lock)$|package(?:-lock)?\.json$|env\.template$|.*\.(?:md|ya?ml)$|Dockerfile$|LICENSE$|NOTICE$)">
        Require all denied
    </FilesMatch>
</Directory>
<LocationMatch "^/(?:vendor|node_modules|bin|tests|docs|deploy|integrations|design|LICENSES)(?:/|$)">
    Require all denied
</LocationMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "no-referrer"
Header always set X-Frame-Options "DENY"
Header always set Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https: wss: ws://localhost:7880 ws://127.0.0.1:7880; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
AddType application/wasm .wasm
AddType text/javascript .mjs
LimitRequestBody 6291456

<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Auto Translate Meeting · Meeting request</title>
<link rel="icon" type="image/svg+xml" href="../assets/brand/mark.svg">
<script>(function(){var th=null;try{th=localStorage.getItem('wm-theme')}catch(e){}if(th==='blue')th='dark';if(th!=='dark'&&th!=='light')th=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';document.documentElement.dataset.theme=th})()</script>
<link rel="stylesheet" href="../assets/css/app.css?v=9">
<link rel="stylesheet" href="../assets/css/book.css?v=3">
<script src="../assets/js/branding.js" defer></script>
</head>
<body class="bkpage">
<div class="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i></div>
<div class="grain"></div><div class="vig"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="cluster">
  <div style="position:relative">
    <div class="lmenu glass" id="lmenu" role="menu"></div>
    <div class="grp glass"><button class="lbtn" id="lbtn" type="button" aria-haspopup="menu"><b class="ic" id="gico"></b><span id="lcode">TR</span></button></div>
  </div>
  <div class="grp glass" role="radiogroup">
    <button class="tbtn" type="button" role="radio" data-th="dark" id="th-d"><i></i></button>
    <button class="tbtn" type="button" role="radio" data-th="light" id="th-l"><i></i></button>
  </div>
</div>

<main class="bk">
  <header class="bk-top"><a href="../" class="brand-link"><img class="logo" data-brand-logo src="../assets/brand/mark.svg" alt=""><strong data-app-name>Auto Translate Meeting</strong></a></header>

  <section class="panel glass bk-panel" id="step-pick">
    <h1 data-t="b_title"></h1>
    <p class="lead" data-t="b_lead"></p>
    <div id="bk-state" class="bk-state" role="status"></div>
    <div id="bk-body" hidden>
      <h2 class="bk-h" data-t="b_pick_day"></h2>
      <div class="days" id="days" role="listbox" aria-label=""></div>
      <h2 class="bk-h" data-t="b_pick_time"></h2>
      <div class="times" id="times" role="listbox"></div>
      <p class="fine bk-tz" id="tzline"></p>
    </div>
  </section>

  <form class="panel glass bk-panel" id="step-form" autocomplete="on" novalidate hidden>
    <div class="bk-sel"><div><small data-t="b_selected"></small><b id="sel-when"></b></div><button type="button" class="bk-link" id="sel-change" data-t="b_change"></button></div>
    <div class="field"><label for="f-name" data-t="b_name"></label><input id="f-name" name="name" class="input" maxlength="80" autocomplete="name" required></div>
    <div class="field"><label for="f-email" data-t="b_email"></label><input id="f-email" name="email" type="email" class="input" maxlength="120" autocomplete="email" inputmode="email" required></div>
    <div class="field"><label for="f-company" data-t="b_company"></label><input id="f-company" name="company" class="input" maxlength="100" autocomplete="organization"></div>
    <div class="field"><label for="f-lang" data-t="b_lang"></label><select id="f-lang" class="select"></select></div>
    <div class="field"><label for="f-note" data-t="b_note"></label><textarea id="f-note" class="input bk-note" maxlength="600" rows="3" data-t-ph="b_note_ph"></textarea></div>
    <input type="text" id="f-web" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" class="bk-hp">
    <button class="go" type="submit" id="f-send"><span data-t="b_send"></span></button>
    <p class="err" id="f-err" role="alert"></p>
    <p class="fine"><b class="ic" id="shield"></b><span data-t="b_privacy"></span></p>
  </form>

  <section class="panel glass bk-panel bk-done" id="step-done" hidden>
    <div class="bk-ok" id="okico"></div>
    <h1 data-t="b_done_t"></h1>
    <p class="lead" id="done-when"></p>
    <p class="lead" data-t="b_done_p"></p>
  </section>
</main>

<script src="../assets/js/select.js?v=1" defer></script>
<script src="../assets/js/book.js?v=3" defer></script>
</body>
</html>
